openapi: 3.1.0
info:
  title: Isyara AI Services
  version: 0.2.0
  description: Internal REST contract for the Isyara STT and TTS services.
servers:
  - url: http://127.0.0.1:8001
paths:
  /v1/stt/transcriptions:
    post:
      operationId: transcribeAudio
      tags: [Speech-to-Text]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InternalApiKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, language, encoding]
              properties:
                audio:
                  type: string
                  format: binary
                language:
                  type: string
                  example: en
                encoding:
                  type: string
                  enum: [wav, webm, flac]
                timestamps:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Transcription completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/tts/synthesize:
    post:
      operationId: synthesizeSpeech
      tags: [Text-to-Speech]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InternalApiKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesisRequest'
      responses:
        '200':
          description: WAV audio generated by VoxCPM2.
          headers:
            X-Request-ID:
              schema: { type: string, format: uuid }
            X-Model-ID:
              schema: { type: string }
            X-Latency-Ms:
              schema: { type: integer }
            X-Audio-Sample-Rate:
              schema: { type: integer }
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      responses:
        '200':
          description: Process is alive.
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      responses:
        '200':
          description: Per-model readiness information.
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    InternalApiKey:
      name: X-Internal-API-Key
      in: header
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    ModelDescriptor:
      type: object
      required: [provider, id]
      properties:
        provider: { type: string, example: local-ctranslate2 }
        id: { type: string, example: Systran/faster-whisper-large-v3 }
    TranscriptionSegment:
      type: object
      required: [text, startMs, endMs]
      properties:
        text: { type: string }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 0 }
    TranscriptionResponse:
      type: object
      required: [requestId, text, language, segments, model, latencyMs]
      properties:
        requestId: { type: string, format: uuid }
        text: { type: string }
        language: { type: string }
        segments:
          type: array
          items: { $ref: '#/components/schemas/TranscriptionSegment' }
        model: { $ref: '#/components/schemas/ModelDescriptor' }
        latencyMs: { type: integer, minimum: 0 }
    SynthesisRequest:
      type: object
      required: [text, language, format]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        language: { type: string, example: en }
        voice:
          type: [string, 'null']
          enum: [default, null]
        format:
          type: string
          enum: [wav]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, requestId, details]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            requestId: { type: string }
            details: { type: object }
  responses:
    Error:
      description: Normalized service error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
