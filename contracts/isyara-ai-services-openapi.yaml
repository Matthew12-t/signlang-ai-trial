openapi: 3.1.0
info:
  title: Isyara AI Services API
  version: 0.2.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    HTTP contracts for Isyara AI services. STT, TTS, Gloss, and Recall are
    internal Application API dependencies. Sign prediction is an edge-local
    exception called by the web client over loopback on the signer's laptop;
    sign video never reaches the Application API.
servers:
  - url: /
    description: Current AI service origin
security:
  - InternalApiKey: []
tags:
  - name: Health
    description: Process liveness and dependency readiness.
  - name: Sign
    description: Word-level isolated sign prediction.
  - name: STT
    description: Speech-to-text transcription.
  - name: TTS
    description: Text-to-speech synthesis.
  - name: Gloss
    description: Confirmed sign-token normalization.
  - name: Recall
    description: Transcript-grounded question answering.
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check dependency and model readiness.
      security: []
      responses:
        "200":
          description: Service is ready to receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sign/predict:
    post:
      tags: [Sign]
      operationId: predictSign
      summary: Predict one isolated sign from one short video clip.
      description: |
        Called by the signer web client against the loopback Sign Service. The
        browser-local demo mode does not require an internal API key.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [video, topK, vocabularyVersion]
              properties:
                video:
                  type: string
                  format: binary
                topK:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
                vocabularyVersion:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        "200":
          description: Prediction completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignPredictionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/stt/transcriptions:
    post:
      tags: [STT]
      operationId: createTranscription
      summary: Transcribe one audio payload.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, language, encoding]
              properties:
                audio:
                  type: string
                  format: binary
                language:
                  type: string
                  default: en
                  minLength: 2
                  maxLength: 16
                encoding:
                  $ref: "#/components/schemas/AudioInputEncoding"
                timestamps:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Transcription completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tts/synthesize:
    post:
      tags: [TTS]
      operationId: synthesizeSpeech
      summary: Synthesize confirmed text as speech.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SynthesizeSpeechRequest"
      responses:
        "200":
          description: Audio generated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Model-ID:
              schema:
                type: string
            X-Latency-Ms:
              schema:
                type: integer
                minimum: 0
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/gloss/normalize:
    post:
      tags: [Gloss]
      operationId: normalizeGloss
      summary: Normalize confirmed sign tokens into final text.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NormalizeGlossRequest"
      responses:
        "200":
          description: Tokens normalized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizeGlossResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/recall/query:
    post:
      tags: [Recall]
      operationId: answerRecallQuery
      summary: Answer a question using only supplied transcript context.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecallRequest"
      responses:
        "200":
          description: Query processed; grounded may be false when context is insufficient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
components:
  securitySchemes:
    InternalApiKey:
      type: apiKey
      in: header
      name: X-Internal-API-Key
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      description: Caller-generated UUID used for correlation.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  headers:
    RequestId:
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ready, alive, not_ready]
        service:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
    AudioInputEncoding:
      type: string
      enum: [wav, webm, flac, pcm_s16le]
    AudioOutputFormat:
      type: string
      enum: [wav, flac]
    ModelInfo:
      type: object
      additionalProperties: false
      required: [provider, id]
      properties:
        provider:
          type: string
        id:
          type: string
    SignCandidate:
      type: object
      additionalProperties: false
      required: [label, confidence]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
    SignPredictionStatus:
      type: string
      enum: [CONFIDENT, AMBIGUOUS, UNKNOWN, INVALID_INPUT, NO_SIGN]
    SignPredictionResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - predictionId
        - prediction
        - confidence
        - candidates
        - status
        - requiresConfirmation
        - modelVersion
        - vocabularyVersion
        - latencyMs
      properties:
        requestId:
          type: string
          format: uuid
        predictionId:
          type: string
          minLength: 1
        prediction:
          type: [string, "null"]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        candidates:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SignCandidate"
        status:
          $ref: "#/components/schemas/SignPredictionStatus"
        requiresConfirmation:
          type: boolean
        modelVersion:
          type: string
        vocabularyVersion:
          type: string
        latencyMs:
          type: integer
          minimum: 0
    TranscriptionSegment:
      type: object
      additionalProperties: false
      required: [text, startMs, endMs]
      properties:
        text:
          type: string
        startMs:
          type: integer
          minimum: 0
        endMs:
          type: integer
          minimum: 0
    TranscriptionResponse:
      type: object
      additionalProperties: false
      required: [requestId, text, language, segments, model, latencyMs]
      properties:
        requestId:
          type: string
          format: uuid
        text:
          type: string
        language:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionSegment"
        model:
          $ref: "#/components/schemas/ModelInfo"
        latencyMs:
          type: integer
          minimum: 0
    SynthesizeSpeechRequest:
      type: object
      additionalProperties: false
      required: [text, language, format]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        language:
          type: string
          default: en
        voice:
          type: [string, "null"]
        format:
          $ref: "#/components/schemas/AudioOutputFormat"
    ConfirmedSignToken:
      type: object
      additionalProperties: false
      required: [id, label, confirmedAt]
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
          maxLength: 80
        confirmedAt:
          type: string
          format: date-time
    NormalizeGlossRequest:
      type: object
      additionalProperties: false
      required: [utteranceId, language, tokens]
      properties:
        utteranceId:
          type: string
          minLength: 1
        language:
          type: string
          default: en
        tokens:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ConfirmedSignToken"
    NormalizeGlossResponse:
      type: object
      additionalProperties: false
      required: [requestId, utteranceId, text, method, sourceTokenIds, warnings, latencyMs]
      properties:
        requestId:
          type: string
          format: uuid
        utteranceId:
          type: string
        text:
          type: string
        method:
          type: string
          enum: [template, llm, identity]
        sourceTokenIds:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        latencyMs:
          type: integer
          minimum: 0
    TranscriptEntry:
      type: object
      additionalProperties: false
      required: [id, sequence, source, text, startedAt, endedAt]
      properties:
        id:
          type: string
          minLength: 1
        sequence:
          type: integer
          minimum: 0
        source:
          type: string
          enum: [speech, sign]
        speaker:
          type: [string, "null"]
        text:
          type: string
          minLength: 1
          maxLength: 4000
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
    RecallOptions:
      type: object
      additionalProperties: false
      properties:
        maxAnswerTokens:
          type: integer
          minimum: 32
          maximum: 512
          default: 160
        requireEvidence:
          type: boolean
          default: true
    RecallRequest:
      type: object
      additionalProperties: false
      required: [sessionId, query, language, contextEntries]
      properties:
        sessionId:
          type: string
          minLength: 1
        query:
          type: string
          minLength: 1
          maxLength: 1000
        language:
          type: string
          default: en
        contextEntries:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/TranscriptEntry"
        options:
          $ref: "#/components/schemas/RecallOptions"
    Evidence:
      type: object
      additionalProperties: false
      required: [entryId, quote, startedAt]
      properties:
        entryId:
          type: string
        quote:
          type: string
          minLength: 1
        startedAt:
          type: string
          format: date-time
    NotFoundReason:
      type: [string, "null"]
      enum:
        - NOT_IN_CONTEXT
        - EMPTY_CONTEXT
        - EVIDENCE_VALIDATION_FAILED
        - null
    RecallResponse:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              grounded:
                const: true
          then:
            properties:
              evidence:
                minItems: 1
              notFoundReason:
                type: "null"
        - if:
            properties:
              grounded:
                const: false
          then:
            properties:
              notFoundReason:
                type: string
      required:
        - requestId
        - answer
        - grounded
        - evidence
        - notFoundReason
        - model
        - latencyMs
      properties:
        requestId:
          type: string
          format: uuid
        answer:
          type: string
        grounded:
          type: boolean
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        notFoundReason:
          $ref: "#/components/schemas/NotFoundReason"
        model:
          $ref: "#/components/schemas/ModelInfo"
        latencyMs:
          type: integer
          minimum: 0
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, requestId, details]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            requestId:
              type: string
              format: uuid
            details:
              type: object
              additionalProperties: true
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    PayloadTooLarge:
      description: Request payload exceeds configured limits.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    UnsupportedMediaType:
      description: Audio media type or encoding is unsupported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    UnprocessableEntity:
      description: Request is valid JSON but cannot be processed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    RateLimited:
      description: Service or upstream provider rate limit reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    BadGateway:
      description: Upstream provider returned an unusable response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ServiceUnavailable:
      description: Model or upstream provider is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    GatewayTimeout:
      description: Upstream inference exceeded the deadline.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
