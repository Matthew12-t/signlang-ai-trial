[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isyara-ai-services"
version = "0.2.0"
description = "Local STT and TTS services for Isyara"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.34,<2",
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.9",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.1,<2"]
tts = ["voxcpm"]
all = ["faster-whisper>=1.1,<2", "voxcpm"]
test = ["httpx>=0.28,<1", "pytest>=7.4,<9", "pytest-asyncio>=0.25,<1"]
dev = ["httpx>=0.28,<1", "pytest>=7.4,<9", "pytest-asyncio>=0.25,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "smoke: loads real model weights or calls an explicitly enabled external provider",
]
