[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isyara-ai-services"
version = "0.2.0"
description = "Local STT and TTS services for Isyara"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.1,<2"]
tts = ["voxcpm"]
all = ["faster-whisper>=1.1,<2", "voxcpm"]
test = ["httpx>=0.27,<1", "pytest>=7.4,<9"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "smoke: loads real model weights and requires the optional AI dependencies",
]
